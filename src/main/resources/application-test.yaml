spring:
  datasource:
    url: jdbc:h2:mem:bnote-test;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

jwt:
  secret: test-secret-key-for-jwt-signing-in-tests-only-do-not-use-in-prod
  access-token-expire-seconds: 3600
  refresh-token-expire-seconds: 1209600

file:
  upload:
    path: ./build/test-uploads

oauth:
  kakao:
    client-id: test-kakao-client-id
    redirect-uri: http://localhost:3000/auth/kakao/callback
  google:
    client-id: test-google-client-id
    client-secret: test-google-client-secret
    redirect-uri: http://localhost:3000/auth/google/callback

bible:
  seed:
    on-startup: false
    path: bible-data-test/