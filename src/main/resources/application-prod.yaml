spring:
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
  h2:
    console:
      enabled: false

file:
  storage:
    type: supabase

supabase:
  storage:
    url: ${SUPABASE_STORAGE_URL}
    bucket: ${SUPABASE_STORAGE_BUCKET:bnote-uploads}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}