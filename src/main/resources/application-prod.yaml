spring:
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
      validation-timeout: 5000
      data-source-properties:
        reWriteBatchedInserts: true
        prepareThreshold: 0
        connectTimeout: 10
        socketTimeout: 30
        loginTimeout: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500
  h2:
    console:
      enabled: false

file:
  storage:
    type: supabase

supabase:
  storage:
    url: ${SUPABASE_STORAGE_URL}
    bucket: ${SUPABASE_STORAGE_BUCKET:bnote-uploads}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}